# A generic, single database configuration for the backup_auth service.
# admin_panel shares the same database, so we keep migrations in one place
# (here) and admin_panel does not run alembic separately.

[alembic]
script_location = %(here)s
prepend_sys_path = .
version_path_separator = os

# Explicitly set sqlalchemy.url at runtime via env (sqlalchemy_url_factory in env.py).
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
